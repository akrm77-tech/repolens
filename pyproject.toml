[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.1.0"
description = "Local-first, multilingual repository intelligence for humans and AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "RepoLens contributors"}]
keywords = ["code-intelligence", "repository", "architecture", "mcp", "developer-tools", "multilingual"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]

[project.scripts]
repolens = "repolens.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff==0.17.2", "mypy==2.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
